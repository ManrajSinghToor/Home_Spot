# Server Port Configuration
server.port=${PORT:5001}

# PostgreSQL Connection Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rental_hub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:supersecretkey123}
jwt.expirationMs=2592000000

# Jackson JSON formatting
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Spring Logging
logging.level.org.springframework.web=INFO
logging.level.com.homespot=DEBUG
logging.level.org.hibernate.SQL=DEBUG
